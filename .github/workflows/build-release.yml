name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          repository: pinbe/Plinn.git
          ref: v0.9.0
          path: Plinn

      - uses: actions/checkout@v7
        with:
          repository: pinbe/photoprint.git
          ref: cbb
          path: photoprint

      - uses: actions/checkout@v7
        with:
          repository: pinbe/Portfolio.git
          ref: cbb
          path: Portfolio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.8.1

      - name: Npm Install
        working-directory: ./Portfolio/Products/Portfolio/ts
        run: npm ci

      - name: Webpack Build
        working-directory: ./Portfolio/Products/Portfolio/ts
        run: npx webpack --config webpack.config.js

      - name: Cleaning up and creating tarball
        run: |
          rm -rf Portfolio/Products/Portfolio/ts/node_modules
          rm -rf Portfolio/.git*
          tar -cJf build.tar.xz Portfolio/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build.tar.xz
